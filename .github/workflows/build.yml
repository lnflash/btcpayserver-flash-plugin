name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build .btcpay the way the Plugin Builder does
        run: ./build-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BTCPayServer.Plugins.Flash.btcpay
          path: |
            bin/Release/BTCPayServer.Plugins.Flash.btcpay
            bin/Release/package/**/*.btcpay.json
      - name: Check tag matches packaged version and extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./release-check.sh "${GITHUB_REF_NAME}"
      - name: Attach package to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            bin/Release/BTCPayServer.Plugins.Flash.btcpay
            bin/Release/package/*/*/BTCPayServer.Plugins.Flash.btcpay.json
